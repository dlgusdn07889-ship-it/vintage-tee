name: Hunter regression tests

on:
  pull_request:
  push:
    branches: [main, hunter-v7-precision]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s tests -v
